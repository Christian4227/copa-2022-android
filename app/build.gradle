import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "kotlin-kapt"
    id "dagger.hilt.android.plugin"
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId "me.dio.copa.catar"
        minSdk 26
        targetSdk = 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }


    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion compose_compiler_version
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
    namespace 'me.dio.copa.catar'
}

dependencies {
    implementation project(":domain")
    implementation project(":data:data")
    implementation project(":data:local")
    implementation project(":data:remote")
    implementation project(":notification-scheduler")

    implementation "androidx.core:core-splashscreen:1.2.0"

    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.compose.ui:ui:1.10.1"
    implementation "androidx.compose.material:material:1.10.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.activity:activity-compose:1.6.0"
    implementation 'androidx.compose.ui:ui-android:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation "junit:junit:4.13.2"

    implementation "androidx.work:work-runtime-ktx:2.11.0"

    // hilt
    implementation "com.google.dagger:hilt-android:2.58"
    kapt "com.google.dagger:hilt-compiler:2.58"

    // coil
    implementation "io.coil-kt:coil-compose:2.2.2"

    // NavController
    implementation "androidx.navigation:navigation-compose:2.9.6"

    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
}
